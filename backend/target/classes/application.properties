# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buildgenie_db
spring.datasource.username=buildgenie_user
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# URL for the external Python forecasting service
ai.forecast.service.url=http://localhost:5001/predict