# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buildgenie_db
spring.datasource.username=buildgenie_user
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# URL for the external Python forecasting service
# Use environment variable if provided (e.g., Railway), fallback to localhost
ai.forecast.service.url=${AI_FORECAST_SERVICE_URL:http://localhost:5001/predict}

# CORS Configuration
# Comma-separated list of allowed origins used by Spring Security/WebMvc
# Includes common dev ports, mobile (Capacitor/Ionic) origins, and prod domains
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3003,http://127.0.0.1:3000,capacitor://localhost,ionic://localhost,http://localhost,https://frontend-production-1b57.up.railway.app,https://your-domain.com,http://10.0.2.2,http://10.0.2.2:8080,http://10.0.2.2:3000,http://localhost:7691,http://localhost:8627,https://localhost}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*:*,http://10.*:*,capacitor://localhost,ionic://localhost,https://*.railway.app,https://*.ngrok.io}
