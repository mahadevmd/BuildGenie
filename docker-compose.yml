version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: buildgenie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildgenie
      POSTGRES_USER: buildgenie_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - buildgenie-network

  # AI Service (Python)
  ai-service:
    build: ./ai-service
    container_name: buildgenie-ai
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://buildgenie_user:${DB_PASSWORD:-password123}@postgres/buildgenie
      BUILDGENIE_MODEL_PATH: buildgenie_pipeline.joblib
      PORT: 5001
      FLASK_ENV: production
      MODEL_PATH: /app/models
    ports:
      - "5001:5001"
    volumes:
      - ai_models:/app/models
    networks:
      - buildgenie-network
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildgenie-backend
    depends_on:
      - postgres
      - ai-service
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/buildgenie
      SPRING_DATASOURCE_USERNAME: buildgenie_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password123}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:5001
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - buildgenie-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: buildgenie-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - buildgenie-network
    restart: unless-stopped

  # Development Frontend (optional, for local development)
  frontend:
    build: ./frontend
    container_name: buildgenie-frontend-dev
    depends_on:
      - backend
      - ai-service
    environment:
      PORT: 3000
      REACT_APP_API_BASE: http://backend:8080
      REACT_APP_AI_API: http://ai-service:5001
    ports:
      - "3000:3000"
    networks:
      - buildgenie-network
    profiles:
      - dev

volumes:
  postgres_data:
  ai_models:

networks:
  buildgenie-network:
    driver: bridge