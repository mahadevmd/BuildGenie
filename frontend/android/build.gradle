// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Ensure the Gradle wrapper and initialization scripts are correctly configured to avoid missing init.gradle errors.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Align Java toolchain across all Android subprojects (e.g., :capacitor-android)
subprojects { afterEvaluate {
    if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }
    }
    // Ensure Kotlin toolchain matches Java version when the Kotlin Android plugin is applied
    if (project.plugins.hasPlugin('org.jetbrains.kotlin.android') || project.plugins.hasPlugin('kotlin-android')) {
        kotlin {
            jvmToolchain(21)
        }
    }
} }

task clean(type: Delete) {
    delete rootProject.buildDir
}
