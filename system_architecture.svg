<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">BuildGenie System Architecture</text>
  
  <!-- Frontend Section -->
  <rect x="50" y="80" width="400" height="650" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10" />
  <text x="250" y="110" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">Frontend (React)</text>
  
  <!-- Frontend Components -->
  <!-- Core -->
  <rect x="80" y="130" width="340" height="80" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="250" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Core Components</text>
  <text x="250" y="175" font-family="Arial" font-size="12" text-anchor="middle">App.js, index.js</text>
  <text x="250" y="195" font-family="Arial" font-size="12" text-anchor="middle">Router Configuration, Global Styles</text>
  
  <!-- Context -->
  <rect x="80" y="220" width="160" height="80" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="160" y="245" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Context</text>
  <text x="160" y="265" font-family="Arial" font-size="12" text-anchor="middle">AuthContext.js</text>
  <text x="160" y="285" font-family="Arial" font-size="12" text-anchor="middle">User Authentication State</text>
  
  <!-- Services -->
  <rect x="260" y="220" width="160" height="80" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="340" y="245" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Services</text>
  <text x="340" y="265" font-family="Arial" font-size="12" text-anchor="middle">api.js</text>
  <text x="340" y="285" font-family="Arial" font-size="12" text-anchor="middle">API Client, Interceptors</text>
  
  <!-- Components -->
  <rect x="80" y="310" width="340" height="100" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="250" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Shared Components</text>
  <text x="250" y="355" font-family="Arial" font-size="12" text-anchor="middle">Header.js, Footer.js, ProtectedRoute.js</text>
  <text x="250" y="375" font-family="Arial" font-size="12" text-anchor="middle">UI Components: button.jsx, card.jsx, input.jsx</text>
  <text x="250" y="395" font-family="Arial" font-size="12" text-anchor="middle">Layout & Navigation Components</text>
  
  <!-- Pages -->
  <rect x="80" y="420" width="340" height="130" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="250" y="445" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Pages</text>
  <text x="250" y="465" font-family="Arial" font-size="12" text-anchor="middle">Authentication: Login.js, Register.js</text>
  <text x="250" y="485" font-family="Arial" font-size="12" text-anchor="middle">PC Building: Builder.js, SavedBuilds.js, SavedBuildDetail.js</text>
  <text x="250" y="505" font-family="Arial" font-size="12" text-anchor="middle">Pre-built Options: GamingBuild.js, BudgetBuild.js,</text>
  <text x="250" y="525" font-family="Arial" font-size="12" text-anchor="middle">OfficeBuild.js, WorkstationBuild.js</text>
  <text x="250" y="545" font-family="Arial" font-size="12" text-anchor="middle">Admin: ComponentInsert.js</text>
  
  <!-- Mock Data -->
  <rect x="80" y="560" width="340" height="60" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="250" y="585" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Mock Data</text>
  <text x="250" y="605" font-family="Arial" font-size="12" text-anchor="middle">mock.js - Development Fallback Data</text>
  
  <!-- Data Flow -->
  <rect x="80" y="630" width="340" height="80" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" rx="5" />
  <text x="250" y="655" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Frontend Data Flow</text>
  <text x="250" y="675" font-family="Arial" font-size="12" text-anchor="middle">1. User Interaction → Component State</text>
  <text x="250" y="695" font-family="Arial" font-size="12" text-anchor="middle">2. API Calls → Backend Services</text>
  <text x="250" y="715" font-family="Arial" font-size="12" text-anchor="middle">3. Response Data → UI Rendering</text>
  
  <!-- Backend Section -->
  <rect x="550" y="80" width="400" height="650" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="10" />
  <text x="750" y="110" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#2e7d32">Backend (Spring Boot)</text>
  
  <!-- Entry Point -->
  <rect x="580" y="130" width="340" height="60" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="750" y="155" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Application Entry Point</text>
  <text x="750" y="175" font-family="Arial" font-size="12" text-anchor="middle">BuildGenieApplication.java - Main Spring Boot App</text>
  
  <!-- Configuration -->
  <rect x="580" y="200" width="340" height="80" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="750" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Configuration</text>
  <text x="750" y="245" font-family="Arial" font-size="12" text-anchor="middle">WebConfig.java - Web Configuration</text>
  <text x="750" y="265" font-family="Arial" font-size="12" text-anchor="middle">DataInitializer.java - Initial Data Setup</text>
  
  <!-- Security -->
  <rect x="580" y="290" width="340" height="100" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="750" y="315" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Security</text>
  <text x="750" y="335" font-family="Arial" font-size="12" text-anchor="middle">SecurityConfig.java - Security Configuration</text>
  <text x="750" y="355" font-family="Arial" font-size="12" text-anchor="middle">JwtAuthenticationFilter.java - JWT Authentication</text>
  <text x="750" y="375" font-family="Arial" font-size="12" text-anchor="middle">JwtTokenUtil.java - JWT Token Utilities</text>
  
  <!-- Controllers -->
  <rect x="580" y="400" width="340" height="120" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="750" y="425" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Controllers</text>
  <text x="750" y="445" font-family="Arial" font-size="12" text-anchor="middle">AuthController.java - Authentication Endpoints</text>
  <text x="750" y="465" font-family="Arial" font-size="12" text-anchor="middle">ComponentController.java - PC Component Endpoints</text>
  <text x="750" y="485" font-family="Arial" font-size="12" text-anchor="middle">PcBuildController.java - PC Build Endpoints</text>
  <text x="750" y="505" font-family="Arial" font-size="12" text-anchor="middle">UserController.java - User Management Endpoints</text>
  
  <!-- Services -->
  <rect x="580" y="530" width="340" height="100" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="750" y="555" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Services</text>
  <text x="750" y="575" font-family="Arial" font-size="12" text-anchor="middle">AuthService.java - Authentication Logic</text>
  <text x="750" y="595" font-family="Arial" font-size="12" text-anchor="middle">ComponentService.java - Component Business Logic</text>
  <text x="750" y="615" font-family="Arial" font-size="12" text-anchor="middle">PCBuildService.java - PC Build Business Logic</text>
  
  <!-- Models & Repositories -->
  <rect x="580" y="640" width="160" height="80" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="660" y="665" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Models</text>
  <text x="660" y="685" font-family="Arial" font-size="12" text-anchor="middle">User.java</text>
  <text x="660" y="705" font-family="Arial" font-size="12" text-anchor="middle">Component.java</text>
  <text x="660" y="725" font-family="Arial" font-size="12" text-anchor="middle">PcBuild.java</text>
  
  <rect x="760" y="640" width="160" height="80" fill="#c8e6c9" stroke="#43a047" stroke-width="1" rx="5" />
  <text x="840" y="665" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Repositories</text>
  <text x="840" y="685" font-family="Arial" font-size="12" text-anchor="middle">UserRepository.java</text>
  <text x="840" y="705" font-family="Arial" font-size="12" text-anchor="middle">ComponentRepository.java</text>
  <text x="840" y="725" font-family="Arial" font-size="12" text-anchor="middle">PcBuildRepository.java</text>
  
  <!-- Database -->
  <rect x="650" y="740" width="200" height="60" fill="#81c784" stroke="#388e3c" stroke-width="2" rx="10" />
  <text x="750" y="775" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL Database</text>
  
  <!-- Connection Lines -->
  <!-- Frontend to Backend -->
  <line x1="450" y1="400" x2="550" y2="400" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="545,395 550,400 545,405" fill="#333" />
  
  <!-- API Flow Arrows -->
  <line x1="500" y1="380" x2="500" y2="420" stroke="#333" stroke-width="1" />
  <text x="500" y="370" font-family="Arial" font-size="12" text-anchor="middle">HTTP/REST</text>
  <text x="500" y="435" font-family="Arial" font-size="12" text-anchor="middle">JSON/JWT</text>
  
  <!-- Backend Flow -->
  <line x1="750" y1="520" x2="750" y2="530" stroke="#333" stroke-width="2" />
  <polygon points="745,525 750,530 755,525" fill="#333" />
  
  <line x1="750" y1="630" x2="750" y2="640" stroke="#333" stroke-width="2" />
  <polygon points="745,635 750,640 755,635" fill="#333" />
  
  <line x1="750" y1="720" x2="750" y2="740" stroke="#333" stroke-width="2" />
  <polygon points="745,735 750,740 755,735" fill="#333" />
  
  <!-- Legend -->
  <rect x="50" y="740" width="400" height="50" fill="white" stroke="#333" stroke-width="1" rx="5" />
  <text x="70" y="765" font-family="Arial" font-size="12" font-weight="bold">Legend:</text>
  
  <rect x="130" y="755" width="20" height="20" fill="#bbdefb" stroke="#1e88e5" stroke-width="1" />
  <text x="155" y="770" font-family="Arial" font-size="12">Frontend Component</text>
  
  <rect x="270" y="755" width="20" height="20" fill="#c8e6c9" stroke="#43a047" stroke-width="1" />
  <text x="295" y="770" font-family="Arial" font-size="12">Backend Component</text>
  
  <line x1="370" y1="765" x2="400" y2="765" stroke="#333" stroke-width="2" stroke-dasharray="5,5" />
  <text x="425" y="770" font-family="Arial" font-size="12">API Communication</text>
</svg>